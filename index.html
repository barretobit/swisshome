<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Swiss Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <div id="toast"></div>

  <section class="view center">
    <form id="login-form" class="card login-card">
      <div class="logo"><img src="favicon.svg" class="logo-icon" alt=""> Swiss Home</div>
      <p class="subtitle">Your home search, in one place.</p>
      <label>Username<input id="login-user" type="text" autocomplete="username" required></label>
      <label>Password<input id="login-pass" type="password" autocomplete="current-password" required></label>
      <button id="login-btn" type="submit" class="btn primary">Sign in</button>
    </form>
  </section>

  <script src="common.js?v=8"></script>
  <script src="login.js?v=2"></script>
</body>
</html>
