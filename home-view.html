<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Swiss Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <div id="toast"></div>

  <header class="topbar">
    <a href="homes.html" class="logo small"><img src="favicon.svg" class="logo-icon" alt=""> Swiss Home</a>
    <div class="top-actions">
      <button id="btn-back" type="button" class="btn ghost sm">&larr; Homes</button>
      <button id="btn-edit" type="button" class="btn primary sm">Edit</button>
    </div>
  </header>

  <main class="wrap">
    <h1 id="v-title"></h1>
    <div class="view-grid">
      <section class="card">
        <h2>Info</h2>
        <div id="v-details"></div>
      </section>
      <section class="card">
        <h2>Views &amp; Notes &amp; Docs</h2>
        <div id="v-notes-docs" class="notes-docs"></div>
      </section>
      <section class="card full" id="v-realtor-card" hidden>
        <h2>Realtor</h2>
        <div id="v-realtor"></div>
      </section>
      <section class="card full">
        <h2>Finance</h2>
        <div id="v-finance"></div>
      </section>
      <section class="card">
        <h2>Map</h2>
        <div id="v-map"></div>
      </section>
      <section class="card">
        <h2>Directions to Zurich HB</h2>
        <div id="v-directions"></div>
      </section>
    </div>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <img id="lightbox-img" alt="">
  </div>

  <div id="notes-modal" class="modal modal-wide" hidden>
    <div class="modal-box card">
      <h2>Notes</h2>
      <label class="c2">Notes<textarea id="notes-modal-text" rows="10" placeholder="Type your notes&hellip;"></textarea></label>
      <div class="modal-actions">
        <button id="notes-modal-cancel" type="button" class="btn ghost">Cancel</button>
        <button id="notes-modal-save" type="button" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <script src="common.js?v=2"></script>
  <script src="homeview.js?v=2"></script>
</body>
</html>
