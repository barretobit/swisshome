<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Swiss Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <div id="toast"></div>

  <header class="topbar">
    <a href="homes.html" class="logo small"><img src="favicon.svg" class="logo-icon" alt=""> Swiss Home</a>
    <button id="btn-home-cancel" type="button" class="btn ghost sm">Cancel</button>
  </header>

  <main class="wrap">
    <h1 id="home-heading">New home</h1>
    <form id="home-form" class="card form">
      <h2 class="form-section">Property</h2>
      <label class="c2">Title<input id="f-title" type="text" placeholder="3.5-Zimmer Neubau mit Seeblick" required></label>
      <label class="c2">Street<input id="f-street" type="text" placeholder="Bahnhofstrasse 12"></label>
      <label>ZIP<input id="f-zip" type="text" inputmode="numeric" maxlength="4" placeholder="8000"></label>
      <label>City<input id="f-city" type="text" placeholder="Z&uuml;rich"></label>
      <label class="c2">Canton
        <select id="f-canton">
          <option value="">&mdash;</option>
          <option value="ZH">Z&uuml;rich (ZH)</option>
          <option value="BE">Bern (BE)</option>
          <option value="LU">Luzern (LU)</option>
          <option value="UR">Uri (UR)</option>
          <option value="SZ">Schwyz (SZ)</option>
          <option value="OW">Obwalden (OW)</option>
          <option value="NW">Nidwalden (NW)</option>
          <option value="GL">Glarus (GL)</option>
          <option value="ZG">Zug (ZG)</option>
          <option value="FR">Fribourg (FR)</option>
          <option value="SO">Solothurn (SO)</option>
          <option value="BS">Basel-Stadt (BS)</option>
          <option value="BL">Basel-Landschaft (BL)</option>
          <option value="SH">Schaffhausen (SH)</option>
          <option value="AR">Appenzell Ausserrhoden (AR)</option>
          <option value="AI">Appenzell Innerrhoden (AI)</option>
          <option value="SG">St. Gallen (SG)</option>
          <option value="GR">Graub&uuml;nden (GR)</option>
          <option value="AG">Aargau (AG)</option>
          <option value="TG">Thurgau (TG)</option>
          <option value="TI">Ticino (TI)</option>
          <option value="VD">Vaud (VD)</option>
          <option value="VS">Valais (VS)</option>
          <option value="NE">Neuch&acirc;tel (NE)</option>
          <option value="GE">Gen&egrave;ve (GE)</option>
          <option value="JU">Jura (JU)</option>
        </select>
      </label>
      <label>Size (m&sup2;)<input id="f-size" type="number" min="0" step="1" placeholder="120"></label>
      <label>Rooms<input id="f-rooms" type="number" min="0" step="0.5" placeholder="3.5"></label>
      <label>House Type
        <select id="f-house-type">
          <option value="">&mdash;</option>
          <option>Apartment</option>
          <option>Duplex</option>
          <option>House</option>
        </select>
      </label>
      <label id="house-floor-wrap" hidden><span id="house-floor-label">Floor</span>
        <select id="f-floor">
          <option value="">&mdash;</option>
          <option value="0">EG</option>
          <option value="1">1 OG</option>
          <option value="2">2 OG</option>
          <option value="3">3 OG</option>
          <option value="4">4 OG</option>
          <option value="5">5 OG</option>
        </select>
      </label>
      <label id="house-floors-wrap" hidden>Floors<input id="f-building-floors" type="number" min="1" step="1" placeholder="2"></label>
      <label>Built Year<input id="f-built" type="number" min="1500" max="2100" placeholder="2019"></label>
      <label>Last Renovation Year<input id="f-renovated" type="number" min="1500" max="2100" placeholder="2024"></label>

      <h2 class="form-section">Price &amp; Costs</h2>
      <label>Price (CHF)<input id="f-price" type="number" min="0" step="1000" placeholder="2350000"></label>
      <label class="check c2"><input id="f-garage" type="checkbox"> Has garage</label>
      <div id="garage-extra" class="c2">
        <label class="check"><input id="f-garage-included" type="checkbox"> Garage price included in home price</label>
        <label id="garage-value-wrap" hidden>Garage Price (CHF)<input id="f-garage-price" type="number" min="0" step="1000" placeholder="50000"></label>
      </div>

      <h2 class="form-section">Listing &amp; Status</h2>
      <label class="c2">Listing URL<input id="f-url" type="url" placeholder="https://www.immoscout24.ch/&hellip;"></label>
      <label class="c2">Main Image URL<input id="f-main-image" type="url" placeholder="https://static.immoscout.ch/&hellip;"></label>
      <div class="c2 links-editor">
        <span class="links-label">Docs Links</span>
        <div id="docs-links-list" class="links-list"><p class="empty small">No links yet.</p></div>
        <div class="links-add">
          <label>Title<input id="dl-title" type="text" placeholder="Floor plan"></label>
          <label>URL<input id="dl-url" type="url" placeholder="https://&hellip;"></label>
          <button id="btn-add-docs-link" type="button" class="btn ghost">Add link</button>
        </div>
      </div>
      <label class="c2">Status
        <select id="f-status">
          <option value="">&mdash;</option>
          <option>Awaiting Information</option>
          <option>Reviewing Information</option>
          <option>In Contact</option>
          <option>Applied for Visit</option>
          <option>To Visit</option>
          <option>Thinking</option>
          <option>Rejected</option>
        </select>
      </label>

      <h2 class="form-section">Realtor Contact</h2>
      <label>Realtor Name<input id="f-realtor" type="text" placeholder="Jane Doe"></label>
      <label>Realtor Phone
        <span class="phone-input">
          <span class="phone-prefix">+41</span>
          <input id="f-realtor-phone" type="tel" inputmode="tel" placeholder="79 123 45 67" autocomplete="off">
        </span>
      </label>
      <label class="c2">Realtor Email<input id="f-realtor-email" type="email" placeholder="jane@immob.ch"></label>

      <h2 class="form-section">Notes</h2>
      <label class="c2">Notes<textarea id="f-notes" rows="4" placeholder="Contact person, viewing dates, pros &amp; cons&hellip;"></textarea></label>
      <div class="c2 form-actions">
        <button type="submit" class="btn primary">Save home</button>
      </div>
    </form>

    <div class="card visits-card">
      <h2>Visits</h2>
      <div id="visits-list" class="visits-list"><p class="empty small">No visits yet.</p></div>
      <div class="visits-add">
        <label>Date<input id="v-date" type="date"></label>
        <label>Time<input id="v-time" type="time"></label>
        <button id="btn-add-visit" type="button" class="btn ghost">Add visit</button>
      </div>
    </div>
  </main>

  <script src="common.js?v=8"></script>
  <script src="home.js?v=4"></script>
</body>
</html>
