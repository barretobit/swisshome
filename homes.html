<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Swiss Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <div id="toast"></div>

    <header class="topbar">
      <a href="homes.html" class="logo small"><img src="favicon.svg" class="logo-icon" alt=""> Swiss Home</a>
      <div class="top-actions">
        <button id="btn-signout" type="button" class="btn ghost sm">Sign out</button>
      </div>
    </header>

    <main class="wrap wide">
      <h1>My Homes</h1>
      <div class="table-tools">
        <input id="search" type="search" class="search-input" placeholder="Search city, postal code or realtor&hellip;">
      </div>
      <div class="table-wrap card">
        <table id="homes-table">
          <thead>
            <tr>
              <th data-sort="image">Image<span class="sort-arrow">&#8645;</span></th>
              <th class="main-col" data-sort="title">Title<span class="sort-arrow">&#8645;</span></th>
              <th data-sort="realtor">Realtor<span class="sort-arrow">&#8645;</span></th>
              <th data-sort="phone">Phone<span class="sort-arrow">&#8645;</span></th>
              <th data-sort="address">Address<span class="sort-arrow">&#8645;</span></th>
              <th data-sort="price">Price<span class="sort-arrow">&#8645;</span></th>
              <th data-sort="status">Status<span class="sort-arrow">&#8645;</span></th>
              <th data-sort="nextvisit">Visit Date<span class="sort-arrow">&#8645;</span></th>
              <th class="right">Actions</th>
            </tr>
          </thead>
          <tbody id="homes-body"></tbody>
        </table>
        <p id="empty-state" class="empty" hidden>No homes yet &mdash; add your first one.</p>
      </div>
      <div class="table-actions">
        <button id="btn-add" type="button" class="btn sm primary">+ Add Home</button>
      </div>

      <h2>Scheduled Visits</h2>
      <div class="table-wrap card">
        <table id="visits-table">
          <thead>
            <tr>
              <th>Property</th>
              <th>Address</th>
              <th>Realtor</th>
              <th>Date</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="visits-body"></tbody>
        </table>
        <p id="visits-empty" class="empty" hidden>No upcoming visits.</p>
      </div>
    </main>

    <script src="common.js?v=2"></script>
    <script src="homes.js?v=2"></script>
  </body>
</html>
